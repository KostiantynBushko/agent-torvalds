# pytest configuration for self-development
[pytest]
testpaths = tests chat_manager/tests toolkits/MikroTik-RouterOS/tests toolkits/shodan-toolkit/tests toolkits/math-toolkit/tests toolkits/git-toolkit/tests toolkits/github-toolkit/tests toolkits/os-toolkit/tests toolkits/linux-toolkit/tests toolkits/apt-toolkit/tests toolkits/windows-toolkit/tests toolkits/db-toolkit/tests toolkits/xlsx-toolkit/tests
python_files = test_*.py
python_functions = test_*
python_classes = Test*

# The MikroTik toolkit package lives in a hyphenated directory
# (toolkits/MikroTik-RouterOS/). pytest's default "prepend" import mode
# cannot resolve a relative import inside that package, because
# resolve_package_path() stops the upward walk at the first non-identifier
# directory name. "importlib" mode makes the package-local tests importable.
#
# NOTE: pytest 9.1.1 has no "import-mode" ini option - it is a command-line
# option only. The documented spelling "import-mode = importlib" is silently
# ignored (pytest warns "Unknown config option") and the tests then fail to
# import. The working spelling is an "addopts" entry.
#
# See investigate/MikroTik-RouterOS/MODULE_SPECIFICATION.md section 3.4.
addopts = --import-mode=importlib

# The toolkits live in hyphenated directories, so pytest has to resolve
# their module names through the normal import machinery.
#
# Without this, pytest's "importlib" mode re-creates a toolkit package
# when it imports a module from inside it: once by toolkits/__init__.py
# (which registers the import alias) and once by pytest. The alias would
# then point at the first copy while sys.modules holds the second - two
# sets of classes for the same file.
#
# "consider_namespace_packages" makes pytest resolve the name with
# importlib.util.find_spec(), which imports the parent packages the normal
# way, so the package is in sys.modules before pytest touches it.
consider_namespace_packages = true

# The repository root is on the path, so that the "toolkits" package - and
# with it the import alias that toolkits/__init__.py registers - can be
# imported from anywhere.
#
# The Shodan toolkit lives in a hyphenated directory
# (toolkits/shodan-toolkit/), and that directory *is* the package. It is
# therefore reached through the alias ("toolkits.shodan_toolkit"), and the
# toolkit's own test suite uses relative imports ("from ..client import
# ...") - the same form the MikroTik toolkit uses.
#
# The math toolkit (toolkits/math-toolkit/) follows the same rule: the
# directory is the package, the alias is "toolkits.math_toolkit", and the
# package-local tests use relative imports ("from ..operations import
# ...").
#
# The Git toolkit (toolkits/git-toolkit/) follows it as well: the directory
# is the package, the alias is "toolkits.git_toolkit", and the
# package-local tests use relative imports ("from ..operations import
# ...").
#
# The GitHub toolkit (toolkits/github-toolkit/) follows the same rule: the
# directory is the package, the alias is "toolkits.github_toolkit", and the
# package-local tests use relative imports ("from ..operations import
# ...").
#
# The OS toolkit (toolkits/os-toolkit/) follows it as well: the directory is
# the package, the alias is "toolkits.os_toolkit", and the package-local
# tests use relative imports ("from ..operations import ...").
#
# The Linux toolkit (toolkits/linux-toolkit/) follows it as well: the
# directory is the package, the alias is "toolkits.linux_toolkit", and the
# package-local tests use relative imports ("from ..operations import
# ...").
#
# The APT toolkit (toolkits/apt-toolkit/) follows it as well: the
# directory is the package, the alias is "toolkits.apt_toolkit", and the
# package-local tests use relative imports ("from ..operations import
# ...").
#
# The Windows toolkit (toolkits/windows-toolkit/) follows it as well: the
# directory is the package, the alias is "toolkits.windows_toolkit", and
# the package-local tests use relative imports ("from ..operations import
# ...").
#
# The database toolkit (toolkits/db-toolkit/) follows it as well: the
# directory is the package, the alias is "toolkits.db_toolkit", and the
# package-local tests use relative imports ("from ..operations import
# ...").
#
# The Excel toolkit (toolkits/xlsx-toolkit/) follows it as well: the
# directory is the package, the alias is "toolkits.xlsx_toolkit", and the
# package-local tests use relative imports ("from ..operations import
# ...").
#
# The database toolkit reads its configuration file at import time, so a
# test run needs "db_toolkit_config.yaml" in the working directory.
# The root conftest.py puts it there when it is missing.
pythonpath = .

markers =
    integration: tests that require a real device or network access

# The source modules of the toolkits are not collected, because they are
# not in "testpaths" - only the "tests" directory of each package is.
#
# The APT toolkit's operations carry a function named
# "test_sudo_password", which pytest would collect as a test if the
# module were ever collected directly.  It is not, and the option that
# used to say so - "collect_ignore" - is **not** a pytest ini option:
# pytest warns "Unknown config option: collect_ignore" on every run and
# ignores it.  It has been removed rather than carried along.
