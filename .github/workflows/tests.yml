name: Tests

# The suite carries a set of known failures, so a plain "pytest" run is
# always red.  The gate (scripts/ci_test_gate.py) compares the failures
# with the committed baseline and fails the build only when a failure
# appears that is *not* in it — a new regression breaks the build, the
# known failures do not.
#
# See docs/ci.md for the whole story.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (the CI test gate)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          # The full history: the split-verification check compares the
          # new files with the *committed* original, and it finds it in
          # the history - the state the file was in before it was
          # deleted.  A shallow checkout cannot answer that.
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Install the pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.lock

      - name: Run the test gate
        run: python scripts/ci_test_gate.py

      - name: Upload the failure list
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-failures
          path: /tmp/ci-gate-failures.txt
          if-no-files-found: ignore
