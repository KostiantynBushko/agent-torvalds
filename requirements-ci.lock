# The pinned environment for CI.
#
# requirements.txt states the *minimum* versions the agent supports; this
# file pins the exact versions the CI test gate's baseline was recorded
# with, so the known-failure baseline in tests/ci_baseline.txt means the
# same thing on every runner.  Without the pin, a dependency release would
# change the failure set and the gate would report it as new breakage.
#
# The lock mirrors the environment the baseline was recorded in, which is
# what makes the baseline reproducible.  Three declared requirements are
# deliberately absent, because the baseline was recorded without them:
#
#   llama-index-llms-llama-cpp  pulls llama-cpp-python, which has no
#                                prebuilt wheel and is compiled from
#                                source; the test suite does not need it,
#                                and building it on every runner would
#                                cost minutes and add a toolchain
#                                dependency to CI.
#   asyncssh                   the SSH toolkit is not in master yet.
#   routeros_api               the MikroTik toolkit's tests skip without it.
#
# Regenerate after an intentional dependency change:
#     .venv/bin/pip install -r requirements.txt
#     .venv/bin/pip freeze > requirements-ci.lock
#     .venv/bin/python scripts/ci_test_gate.py --write-baseline
#
